server:
  port: 20002
spring:
  application:
    name: interview-tracking-test
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      idle-timeout: 300000
      connection-timeout: 30000
      max-lifetime: 30000
  jpa:
    show-sql: true
    properties:
      hibernate:
        ddl-auto: validate
        generate_statistics: true

logging:
  level:
    org:
      hibernate:
        SQL: DEBUG
        type:
          descriptor:
            sql:
              BasicBinder: TRACE
        orm:
          jdbc:
            bind: trace
          results: TRACE
